name = "ogiri-dice-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Shared HTTP AI budget per IP; room requests use a separate key in this namespace.
# Cloudflare enforces these limits per location, not as a global spending cap.
[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1427001"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["GameRoom"]
